name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install
        run: npm ci

      - name: Chromium for Storybook tests
        run: npx playwright install --with-deps chromium

      # tokens: validate → build → test dist/. ui: typecheck → build → story tests (Vitest browser + a11y)
      - name: Validate, build, test (all workspaces)
        run: npm test

      # Semantic color is generated from docs/reference; re-run it and confirm 276 contrast checks still pass.
      - name: Regenerate semantic color (contrast checks)
        run: npm run check:color

      # Generated files are committed. Any drift means someone edited dist/ or tokens/ by hand.
      - name: Generated files match the committed ones
        run: |
          git status --porcelain
          git diff --exit-code --stat -- packages/tokens/tokens packages/tokens/dist docs/reference/semantic-color-map.json docs/reference/semantic-color-checks.json docs/reference/semantic-shadow.json
